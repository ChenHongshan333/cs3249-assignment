<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PaperLens Architecture</title>
  <style>
    body { margin: 0; padding: 24px; background: #f7f4ed; color: #1f211c; font-family: Cambria, Georgia, serif; }
    h1 { margin: 0 0 4px; font-size: 20px; font-weight: 400; }
    p { margin: 0 0 20px; color: #61665d; font-size: 14px; }
    .mermaid { padding: 16px; border: 1px solid #d6ded1; border-radius: 10px; background: #fff; }
  </style>
</head>
<body>
  <h1>Figure 1. PaperLens architecture</h1>
  <p>Draft rendered from docs/architecture.mmd (the same text is the source of truth). Right-click the diagram to save it, or take a screenshot.</p>
  <pre class="mermaid" id="diagram">Loading…</pre>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script>
    // The diagram text is kept in one place (architecture.mmd). It is inlined below by copy, because a page opened
    // from disk cannot fetch a neighbouring file.
    const source = `flowchart LR
  subgraph FE["Browser · React + TypeScript (src/)"]
    direction TB
    WS["PaperLensWorkspace.tsx<br/>screen flow · state · language"]
    CONV["Conversation.tsx<br/>layered answer · sources · judgment"]
    PDF["PaperPane.tsx + PdfViewer.tsx<br/>PDF.js pages · quote highlight (highlight.ts)"]
    NOTE["SessionNotes.tsx<br/>editable note · .md export"]
    API["api.ts · REST client"]
    WS --- CONV & PDF & NOTE
    WS --> API
  end

  subgraph BE["FastAPI back end · Python (backend/app/)"]
    direction TB
    MAIN["main.py · HTTP routes"]
    CORE["core.py · service layer<br/>run_turn · critical review · judgment · note · export"]
    ING["ingest.py · ingestion<br/>extract → clean → chunk → embed → overview"]
    subgraph LG["graph.py · LangGraph turn workflow"]
      direction LR
      A[load_session] --> B[rewrite_query]
      B -- whole paper --> C[load_overview] --> D[retrieve]
      B -- local --> D
      D --> E[generate_answer] --> F["validate_citations<br/>+ quotes.py"] --> G[save_session]
    end
    MAIN --> CORE --> LG
    MAIN --> ING
  end

  OR[("OpenRouter<br/>Claude Haiku 5.5<br/>text-embedding-3-small")]
  CH[("Chroma<br/>passage vectors")]
  FS[("Local files<br/>papers · sessions · JSONL logs")]
  SCR["scripts/run_conversation.py<br/>(scripted test runs)"]

  API -- "REST /api" --> MAIN
  B & E -- "llm.py + prompts/" --> OR
  D -- "retrieval.py, filtered by paper_id" --> CH
  ING --> CH
  ING -- "embeddings · overview" --> OR
  CORE -- "storage.py" --> FS
  SCR --> CORE`;
    const el = document.getElementById('diagram');
    el.textContent = source;
    mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'strict', fontFamily: 'Cambria, Georgia, serif' });
    mermaid.run({ nodes: [el] }).catch((error) => { el.textContent = 'Could not render the diagram: ' + error; });
  </script>
</body>
</html>
